name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THE TWO JOB NAMES BELOW ARE A CONTRACT: "Build and test" and "Smoke test on
# this pull request" are required by the repo ruleset Require CI (23861154),
# matched by exact string. Renaming one does not fail the build: the required
# check never reports and every pull request waits forever. Add a new required
# name to the ruleset only after it has reported on main once; remove it from
# the ruleset before the pull request that drops the job merges.
#
# The smoke job runs only on same-repository pull requests, so a fork pull
# request never satisfies the ruleset and cannot merge without a maintainer
# pushing its branch into this repository first. That is intended.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # actions/upload-code-coverage writes a code quality report against the
      # head commit, which feeds the enterprise Code Coverage ruleset.
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The upload attributes the report to the pull request head commit,
          # so measure that tree rather than the merge commit pull_request
          # checks out by default.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest

      - name: dist must match src
        run: |
          pnpm build
          git add --intent-to-add dist
          git diff --exit-code dist && exit 0
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::dist/ does not match src/. Run pnpm build and commit dist/."
          else
            echo "::error::git diff failed with status $status"
          fi
          exit 1

  # Runs this build against this pull request. The fixture under
  # test/fixtures/ carries a mermaid block, so a PR that touches it gets a
  # real review comment from the action under test; a PR that does not
  # exercises the read path and the empty plan only.
  smoke:
    name: Smoke test on this pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Run this build against this pull request
        id: smoke
        uses: ./

      - name: The smoke test must have completed, with a comment when the fixture changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.smoke.outputs.outcome }}
          COMMENTS: ${{ steps.smoke.outputs.comments }}
        run: |
          expected=$(gh pr diff "$PR" --name-only | grep -c '^test/fixtures/sample.md$' || true)
          echo "outcome=${OUTCOME} comments=${COMMENTS} expected=${expected}"
          test "$OUTCOME" = "completed"
          test "$COMMENTS" = "$expected"
