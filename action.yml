name: 'Mermaid preview'
description: "Comments a rendered preview of each changed mermaid block in pull request Markdown, linked to mermaid.live."
author: 'brianespinosa'
branding:
  icon: 'eye'
  color: 'blue'
inputs:
  token:
    description: 'Token for the pull request API calls. Needs pull-requests: write. The default GITHUB_TOKEN is enough for same-repository pull requests.'
    required: false
    default: ${{ github.token }}
  pr-number:
    description: 'Pull request number. Defaults to the pull request that triggered the run.'
    required: false
  theme:
    description: 'Mermaid theme for the link and the light-mode image (default, dark, forest, neutral, or a custom name). Dark-mode readers always get the dark theme.'
    required: false
    default: 'default'
  type:
    description: 'What the comment shows. image: the rendered diagram from mermaid.ink, linking to mermaid.live. link: a "View in mermaid.live" text link only.'
    required: false
    default: 'image'
  attribution:
    description: 'Append a small "Generated by bje-actions/mermaid-preview" line to each comment. Set to false to omit it.'
    required: false
    default: 'true'
outputs:
  outcome:
    description: 'completed when every comment was synced, read-only when the token could not write review comments (fork pull request) and the links went to the job summary instead, failed otherwise.'
  comments:
    description: 'Number of review comments created or updated.'
runs:
  using: 'node24'
  main: 'dist/index.js'
