name: 'Mermaid preview'
description: "Comments a mermaid.live preview link on each changed mermaid block in pull request Markdown."
author: 'brianespinosa'
branding:
  icon: 'eye'
  color: 'blue'
inputs:
  token:
    description: 'Token for the pull request API calls. Needs pull-requests: write. The default GITHUB_TOKEN is enough for same-repository pull requests.'
    required: false
    default: ${{ github.token }}
  pr-number:
    description: 'Pull request number. Defaults to the pull request that triggered the run.'
    required: false
  theme:
    description: 'Mermaid theme name encoded into the preview link (default, dark, forest, neutral, or a custom name).'
    required: false
    default: 'default'
outputs:
  outcome:
    description: 'completed when every comment was synced, read-only when the token could not write review comments (fork pull request) and the links went to the job summary instead, failed otherwise.'
  comments:
    description: 'Number of review comments created or updated.'
runs:
  using: 'node24'
  main: 'dist/index.js'
